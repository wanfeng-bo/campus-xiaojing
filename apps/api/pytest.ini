[pytest]
# Public installation verification profile. Historical suites remain reference-only.
testpaths =
    tests/test_live_governance.py
    tests/school_facts/test_live_model_policy.py
    tests/school_facts/test_live_scope_migration.py
    tests/test_live_school_scope_writer_postgres.py
    tests/test_live_school_scope_postgres.py
addopts = -ra
markers =
    integration: requires a new isolated PostgreSQL integration database
    destructive_migration: requires a disposable migration database
