[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "campus-ai-api"
version = "0.1.0"
description = "中学校园综合智能体后端"
requires-python = ">=3.13,<3.14"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "httpcore>=1,<2",
  "httpx>=0.27,<1",
  "openpyxl>=3.1,<4",
  "psycopg[binary]>=3.2,<4",
  "pydantic>=2.10,<3",
  "pydantic-settings>=2.6,<3",
  "redis>=5,<7",
  "SQLAlchemy>=2.0,<3",
  "uvicorn[standard]>=0.32,<1",
]

[project.optional-dependencies]
f2-assistant = [
  "pydantic-ai-slim[openai]==2.42.0",
  "pydantic-graph==2.42.0",
  "openai==3.13.0",
  "httpx2==2.12.0",
  "httpcore2==2.12.0",
  "pydantic==2.13.5",
  "pydantic-core==2.46.5",
  "anyio==4.15.0",
  "httpx==0.28.1",
  "genai-prices==0.1.6",
  "logfire-api==5.1.0",
  "opentelemetry-api==1.44.0",
]
dev = [
  "build>=1.2,<2",
  "PyYAML>=6,<7",
  "pyright>=1.1,<2",
  "pytest>=8,<10",
  "ruff>=0.8,<1",
]

[tool.setuptools]
packages = [
  "app",
  "app.composition",
  "app.core",
  "app.db",
  "app.interfaces",
  "app.interfaces.http",
  "app.integrations",
  "app.integrations.dingtalk",
  "app.integrations.deepseek",
  "app.platform",
  "app.platform.assistant",
  "app.platform.school_facts",
  "app.platform.tenancy",
  "app.platform.directory",
  "app.platform.governance",
  "app.platform.organization",
  "app.platform.policies",
  "app.platform.responsibility",
  "app.platform.idempotency",
  "app.platform.messaging",
  "app.platform.master_data_imports",
  "app.platform.calendar",
  "app.platform.identity",
  "app.platform.authorization",
  "app.platform.audit",
  "app.domains",
  "app.domains.campus",
  "app.domains.repairs",
  "app.domains.students",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "integration: requires the local PostgreSQL integration database",
  "destructive_migration: requires a function-scoped disposable migration database",
]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/20260809_10_master_data_import_takeover_boundary.py" = ["E501"]

[tool.ruff.format]
exclude = [
  "alembic/versions/20260808_09_master_data_imports.py",
  "alembic/versions/20260809_10_master_data_import_takeover_boundary.py",
]

[tool.pyright]
include = ["app", "tests"]
extraPaths = ["../.."]
typeCheckingMode = "basic"
reportMissingTypeStubs = false
venvPath = "."
venv = ".venv"
strict = [
  "app/composition",
  "app/interfaces",
  "app/platform/assistant",
  "app/platform/contracts.py",
  "app/platform/tenancy",
  "app/platform/directory",
  "app/platform/governance",
  "app/platform/organization",
  "app/platform/policies",
  "app/platform/responsibility",
  "app/platform/calendar",
  "app/domains",
  "app/domains/repairs",
  "app/integrations/deepseek",
  "tests/master_data/test_contracts.py",
]
